<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="60%">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="#e6edf3">
    <text x="90" y="250" font-size="88" font-weight="700">What if...</text>
    <text x="90" y="335" font-size="54" fill="#c9d1d9">Devin had a</text>
    <text x="90" y="400" font-size="54" fill="#c9d1d9">chat app?</text>
  </g>
  <text x="92" y="470" font-size="22">
    <tspan fill="#3DDC84">android</tspan><tspan fill="#6e7681" dx="12">›</tspan><tspan dx="12" fill="#e6edf3">termux</tspan><tspan fill="#6e7681" dx="12">›</tspan><tspan dx="12" fill="#51A2DA">fedora</tspan><tspan fill="#6e7681" dx="12">›</tspan><tspan dx="12" fill="#c4a7ff">devin</tspan><tspan fill="#6e7681" dx="12">›</tspan><tspan dx="12" fill="#38bdf8">acp</tspan>
  </text>

  <!-- Android: the phone -->
  <rect x="770" y="30" width="340" height="570" rx="44" fill="#10161d" stroke="#3DDC84" stroke-width="4"/>
  <rect x="905" y="46" width="70" height="8" rx="4" fill="#3DDC84" opacity="0.6"/>
  <text x="800" y="86" font-size="17" fill="#3DDC84">android</text>

  <!-- Ferngeist: chat screen -->
  <rect x="795" y="100" width="290" height="475" rx="12" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="812" y="128" font-size="16" fill="#e6edf3">&#8592; devin <tspan fill="#8b949e">via acp</tspan></text>
  <line x1="795" y1="142" x2="1085" y2="142" stroke="#334155" stroke-width="1.5"/>

  <!-- user bubble (right) -->
  <rect x="885" y="168" width="185" height="62" rx="16" fill="#38bdf8" opacity="0.9"/>
  <g font-size="13" fill="#0b0f14">
    <text x="900" y="194">explain the last</text>
    <text x="900" y="214">commit, briefly</text>
  </g>

  <!-- agent bubble (left) -->
  <rect x="810" y="252" width="210" height="118" rx="16" fill="#1e293b"/>
  <g font-size="13" fill="#e6edf3">
    <text x="826" y="280">It adds Ferngeist,</text>
    <text x="826" y="300">an ACP chat app,</text>
    <text x="826" y="320">paired over</text>
    <text x="826" y="340">loopback. Tests</text>
    <text x="826" y="360">pass.</text>
  </g>

  <!-- typing indicator -->
  <rect x="810" y="392" width="86" height="44" rx="16" fill="#1e293b"/>
  <g fill="#8b949e">
    <circle cx="832" cy="414" r="4"/>
    <circle cx="853" cy="414" r="4"/>
    <circle cx="874" cy="414" r="4"/>
  </g>

  <!-- input field -->
  <rect x="810" y="460" width="260" height="46" rx="23" fill="#10161d" stroke="#334155" stroke-width="1.5"/>
  <text x="828" y="488" font-size="13" fill="#6e7681">Message...</text>
  <circle cx="1046" cy="483" r="14" fill="#38bdf8"/>
  <text x="1046" y="489" font-size="14" fill="#0b0f14" text-anchor="middle">&#8593;</text>
</svg>
